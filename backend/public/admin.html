<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>碧江金楼内容管理</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #342820; background: #f6f1e7; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(900px, calc(100% - 32px)); margin: 40px auto; }
    h1 { margin-bottom: 4px; font-family: serif; }
    .hint { color: #75685e; }
    .toolbar, .editor { padding: 20px; margin: 20px 0; border: 1px solid #ddd0bd; border-radius: 12px; background: #fffdf8; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input, select, textarea, button { width: 100%; padding: 11px; border: 1px solid #c8b9a6; border-radius: 8px; font: inherit; }
    textarea { min-height: 150px; resize: vertical; }
    button { margin-top: 16px; border: 0; color: white; background: #70452e; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .message { min-height: 24px; margin-top: 12px; }
    .error { color: #a52c25; }
    .success { color: #246b3c; }
    .hidden { display: none; }
    .gap-item { padding: 14px 0; border-top: 1px solid #e3d8c8; }
    .reject { background: #8b3f38; }
  </style>
</head>
<body>
  <main>
    <h1>碧江金楼内容管理</h1>
    <div class="hint">仅供管理人员在电脑端使用。保存前会自动备份数据库。</div>

    <section class="toolbar">
      <label for="token">管理口令</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="输入启动后端时设置的 ADMIN_TOKEN">
      <button id="load">读取景点</button>
      <div id="load-message" class="message"></div>
    </section>

    <section id="editor" class="editor hidden">
      <label for="spot">选择景点</label>
      <select id="spot"></select>
      <label for="name">景点名称</label>
      <input id="name" maxlength="60">
      <label for="category">景点类别</label>
      <input id="category" maxlength="40">
      <label for="summary">景点简介</label>
      <textarea id="summary" maxlength="1000"></textarea>
      <button id="save">保存修改</button>
      <div id="save-message" class="message"></div>
    </section>
    <section id="service-editor" class="editor hidden">
      <h2>服务信息</h2>
      <label for="service-address">地址</label><input id="service-address" maxlength="200">
      <label for="service-hours">开放时间</label><input id="service-hours" maxlength="200">
      <label for="service-phone">联系电话</label><input id="service-phone" maxlength="40">
      <label for="service-transport">交通信息</label><textarea id="service-transport" maxlength="500"></textarea>
      <label for="service-ticket">订票链接</label><input id="service-ticket" maxlength="500">
      <button id="save-service">保存服务信息</button><div id="service-message" class="message"></div>
    </section>
    <section id="route-editor" class="editor hidden">
      <h2>路线管理</h2><select id="route"></select>
      <label for="route-name">路线名称</label><input id="route-name">
      <label for="route-theme">主题说明</label><input id="route-theme">
      <label for="route-duration">预计用时</label><input id="route-duration">
      <label for="route-audience">适合人群</label><input id="route-audience">
      <label for="route-stops">站点顺序（每行一个景点名称）</label><textarea id="route-stops"></textarea>
      <button id="save-route">保存路线</button><div id="route-message" class="message"></div>
    </section>
    <section id="review-editor" class="editor hidden">
      <h2>讲解与常见问题审核</h2>
      <label for="narration">讲解</label><select id="narration"></select>
      <label for="narration-status">审核状态</label><select id="narration-status"><option value="draft">草稿</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select>
      <button id="save-narration">保存讲解状态</button>
      <label for="faq">常见问题</label><select id="faq"></select>
      <label for="faq-answer">标准答案</label><textarea id="faq-answer" maxlength="1000"></textarea>
      <label for="faq-review">审核状态</label><select id="faq-review"><option value="pending-scenic-review">待景区审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select>
      <label for="faq-public">公开状态</label><select id="faq-public"><option value="review-draft">审核稿</option><option value="public">可公开</option><option value="not-ready">不可公开</option></select>
      <button id="save-faq">保存常见问题</button><div id="review-message" class="message"></div>
    </section>
    <section id="gap-editor" class="editor hidden"><h2>资料缺口</h2><div id="gap-list"></div></section>
  </main>
  <script>
    let spots = [];
    let dashboard = null;
    const byId = (id) => document.getElementById(id);
    const showMessage = (target, text, type = '') => {
      target.textContent = text;
      target.className = `message ${type}`;
    };
    const headers = () => ({ 'content-type': 'application/json', 'x-admin-token': byId('token').value });
    const fillForm = () => {
      const current = spots.find((item) => item.id === byId('spot').value);
      if (!current) return;
      byId('name').value = current.name;
      byId('category').value = current.category;
      byId('summary').value = current.summary;
      showMessage(byId('save-message'), '');
    };
    const fillRoute = () => {
      const route = dashboard.routes.find((item) => item.id === byId('route').value);
      if (!route) return;
      byId('route-name').value = route.name; byId('route-theme').value = route.theme;
      byId('route-duration').value = route.duration; byId('route-audience').value = route.audience;
      byId('route-stops').value = route.stops.join('\n');
    };
    const fillNarration = () => {
      const item = dashboard.narrations.find((value) => value.id === byId('narration').value);
      if (item) byId('narration-status').value = item.reviewStatus;
    };
    const fillFaq = () => {
      const item = dashboard.faqs.find((value) => value.id === byId('faq').value);
      if (!item) return;
      byId('faq-answer').value = item.answer; byId('faq-review').value = item.reviewStatus; byId('faq-public').value = item.publicStatus;
    };
    const loadDashboard = async () => {
      const response = await fetch('/api/v1/admin/dashboard', { headers: headers() });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || '管理资料读取失败');
      dashboard = body.data;
      byId('service-address').value = dashboard.service.address; byId('service-hours').value = dashboard.service.openingHours;
      byId('service-phone').value = dashboard.service.phone; byId('service-transport').value = dashboard.service.transport;
      byId('service-ticket').value = dashboard.service.ticket.url;
      byId('route').replaceChildren(...dashboard.routes.map((item) => new Option(item.name, item.id)));
      byId('narration').replaceChildren(...dashboard.narrations.map((item) => new Option(`${item.spotName} · ${item.languageLabel}`, item.id)));
      byId('faq').replaceChildren(...dashboard.faqs.map((item) => new Option(item.question, item.id)));
      byId('gap-list').replaceChildren(...dashboard.gaps.map((item) => { const div = document.createElement('div'); div.className = 'gap-item'; div.textContent = `${item.ready ? '✓' : '○'} ${item.label}`; return div; }));
      fillRoute(); fillNarration(); fillFaq();
      ['service-editor', 'route-editor', 'review-editor', 'gap-editor'].forEach((id) => byId(id).classList.remove('hidden'));
    };
    const patch = async (url, data) => {
      const response = await fetch(url, { method: 'PATCH', headers: headers(), body: JSON.stringify(data) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || '保存失败');
      return body;
    };

    byId('load').addEventListener('click', async () => {
      const button = byId('load');
      button.disabled = true;
      showMessage(byId('load-message'), '正在读取…');
      try {
        const response = await fetch('/api/v1/admin/spots', { headers: headers() });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error?.message || '读取失败');
        spots = body.data;
        byId('spot').replaceChildren(...spots.map((item) => {
          const option = document.createElement('option');
          option.value = item.id;
          option.textContent = item.name;
          return option;
        }));
        byId('editor').classList.remove('hidden');
        fillForm();
        await loadDashboard();
        showMessage(byId('load-message'), `已读取 ${spots.length} 个景点`, 'success');
      } catch (error) {
        byId('editor').classList.add('hidden');
        ['service-editor', 'route-editor', 'review-editor', 'gap-editor'].forEach((id) => byId(id).classList.add('hidden'));
        showMessage(byId('load-message'), error.message, 'error');
      } finally {
        button.disabled = false;
      }
    });

    byId('spot').addEventListener('change', fillForm);
    byId('route').addEventListener('change', fillRoute); byId('narration').addEventListener('change', fillNarration); byId('faq').addEventListener('change', fillFaq);
    byId('save-service').addEventListener('click', async () => {
      try { await patch('/api/v1/admin/service', { address: byId('service-address').value, openingHours: byId('service-hours').value, phone: byId('service-phone').value, transport: byId('service-transport').value, ticketUrl: byId('service-ticket').value }); showMessage(byId('service-message'), '服务信息已保存并备份', 'success'); await loadDashboard(); }
      catch (error) { showMessage(byId('service-message'), error.message, 'error'); }
    });
    byId('save-route').addEventListener('click', async () => {
      try { await patch(`/api/v1/admin/routes/${encodeURIComponent(byId('route').value)}`, { name: byId('route-name').value, theme: byId('route-theme').value, duration: byId('route-duration').value, audience: byId('route-audience').value, stops: byId('route-stops').value.split('\n').map((item) => item.trim()).filter(Boolean) }); showMessage(byId('route-message'), '路线已保存并备份', 'success'); await loadDashboard(); }
      catch (error) { showMessage(byId('route-message'), error.message, 'error'); }
    });
    byId('save-narration').addEventListener('click', async () => {
      try { await patch(`/api/v1/admin/narrations/${encodeURIComponent(byId('narration').value)}`, { reviewStatus: byId('narration-status').value }); showMessage(byId('review-message'), '讲解状态已保存并备份', 'success'); await loadDashboard(); }
      catch (error) { showMessage(byId('review-message'), error.message, 'error'); }
    });
    byId('save-faq').addEventListener('click', async () => {
      try { await patch(`/api/v1/admin/faqs/${encodeURIComponent(byId('faq').value)}`, { answer: byId('faq-answer').value, reviewStatus: byId('faq-review').value, publicStatus: byId('faq-public').value }); showMessage(byId('review-message'), '常见问题已保存并备份', 'success'); await loadDashboard(); }
      catch (error) { showMessage(byId('review-message'), error.message, 'error'); }
    });
    byId('save').addEventListener('click', async () => {
      const button = byId('save');
      button.disabled = true;
      showMessage(byId('save-message'), '正在保存…');
      try {
        const response = await fetch(`/api/v1/admin/spots/${encodeURIComponent(byId('spot').value)}`, {
          method: 'PATCH',
          headers: headers(),
          body: JSON.stringify({ name: byId('name').value, category: byId('category').value, summary: byId('summary').value }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error?.message || '保存失败');
        const index = spots.findIndex((item) => item.id === body.data.id);
        spots[index] = { ...spots[index], ...body.data };
        byId('spot').options[byId('spot').selectedIndex].text = body.data.name;
        showMessage(byId('save-message'), body.meta.changed ? '保存成功，修改前数据已备份' : '内容没有变化，无需保存', 'success');
      } catch (error) {
        showMessage(byId('save-message'), error.message, 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
